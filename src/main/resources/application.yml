spring:
  application:
    name: realtime
  data:
    redis:
      host: localhost # overridden to `redis` inside docker-compose via SPRING_DATA_REDIS_HOST
      port: 6379
  codec:
    # Enforced as a clean 413 by GlobalErrorHandler (M3) rather than an unhandled error.
    max-in-memory-size: 256KB
  lifecycle:
    # How long graceful shutdown waits for in-flight work — including long-lived WS
    # sessions (M2) — before forcing termination. Redis connections are closed as part
    # of normal Spring context shutdown regardless, via LettuceConnectionFactory's own
    # lifecycle hooks.
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://localhost:5432/realtime # overridden via SPRING_DATASOURCE_URL in docker-compose
    username: realtime
    password: realtime_dev_only # local dev only — replaced by Fly secrets in M10, matches docker-compose.yml
  jpa:
    hibernate:
      ddl-auto: validate # Flyway owns schema changes; Hibernate just confirms the entity mapping matches
    open-in-view: false # doesn't apply to WebFlux's non-Servlet request lifecycle, but correct if it ever did
  flyway:
    enabled: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # 'prometheus' is exposed now so M9 (Observability) has nothing to unlock later —
        # metrics just won't be interesting until M1+ adds something to measure.
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when-authorized

realtime:
  ingest:
    # How long a webhook fingerprint is remembered for dedup purposes (spec §4).
    # Sized to realistic sender retry windows (e.g. Stripe retries for up to 3 days),
    # deliberately independent of the Redis Stream's own hot-retention window (spec §3) —
    # two different concerns, two different numbers.
    dedup-ttl: 3d
  archive:
    # Redis Stream hot-retention window, enforced by RetentionTrimmer's scheduled
    # XTRIM MINID sweep (spec §3) — uniform across every channel; the per-plan-tier
    # replay window (7/30/90 days) is a Postgres archive-retention concern for M5, not
    # this number.
    hot-window: 24h
    trim-interval: 1h
    # How often ArchiveWriter flushes its in-memory buffer to Postgres as a batch.
    flush-interval: 2s
    # Approximate per-channel cap on the Redis Stream itself (M6c, F-01) — the safety
    # net spec §3 always called for alongside the scheduled MINID sweep above. Without
    # it, a bursty channel grows unbounded for up to trim-interval between sweeps; with
    # no rate limiting until M8, that's an unbounded-until-M8 Redis memory exposure.
    # "~" (approximateTrimming) trades byte-exact precision for letting Redis evict
    # whole radix-tree macro-nodes — the same tradeoff RetentionTrimmer already makes.
    stream-maxlen: 50000
  auth:
    # HS256 needs a key of at least 256 bits (32 bytes) — JJWT throws WeakKeyException
    # at first use otherwise. The fallback below is long enough and local-dev only;
    # override via REALTIME_JWT_SECRET in any real deployment (Fly secrets from M10).
    jwt-secret: ${REALTIME_JWT_SECRET:dev-only-jwt-secret-please-override-in-any-real-deployment-0000}
    jwt-expiry: 24h
